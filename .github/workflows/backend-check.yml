name: Backend checks
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['apple/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check runtime and SQLite capabilities
        run: node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(':memory:'); console.log(process.version,db.prepare('select sqlite_version() as version').get()); db.exec('CREATE VIRTUAL TABLE probe USING fts5(tokens)'); db.close();"
      - name: Run old compatibility and Capture tests
        run: npm test
